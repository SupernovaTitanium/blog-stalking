name: Test workflow
on:
  workflow_dispatch:

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.REPOSITORY }}
          ref: ${{ vars.REF }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Run script
        env:
          FEED_LIST: ${{ vars.TEST_FEED_LIST || 'feeds/test-blogs.json' }}
          FEED_URL: ${{ vars.FEED_URL || '' }}
          WINDOW_HOURS: ${{ vars.TEST_WINDOW_HOURS || '48' }}
          MAX_POST_NUM: ${{ vars.TEST_MAX_POST_NUM || '-1' }}
          MAX_POSTS_PER_FEED: ${{ vars.TEST_MAX_POSTS_PER_FEED || '2' }}
          SEND_EMPTY: ${{ vars.SEND_EMPTY || 'false' }}
          TARGET_LANGUAGE: ${{ vars.TARGET_LANGUAGE || 'Chinese (Traditional)' }}
          EMAIL_SUBJECT_PREFIX: ${{ vars.EMAIL_SUBJECT_PREFIX || 'Blog Pusher Digest' }}
          STATE_FILE: none
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || secrets.OPENAI_MODEL || '' }}
          OPENAI_API_BASE: ${{ vars.OPENAI_API_BASE || secrets.OPENAI_API_BASE || '' }}
          OPENAI_MAX_TOKENS: ${{ vars.OPENAI_MAX_TOKENS || '16384' }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SENDER: ${{ secrets.SENDER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER: ${{ secrets.RECEIVER }}
        run: |
          set -eo pipefail
          mkdir -p artifacts
          uv run main.py --debug --failure_log artifacts/feed_failures.log 2>&1 | tee artifacts/testflow.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflow-logs
          path: artifacts
          retention-days: 7
