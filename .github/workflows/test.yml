name: Test workflow
on:
  workflow_dispatch:

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.REPOSITORY }}
          ref: ${{ vars.REF }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          version: '0.5.4'

      - name: Compute October window
        id: october-window
        run: |
          python - <<'PY'
          from datetime import datetime, timezone

          now = datetime.now(timezone.utc)
          october = datetime(now.year, 10, 1, tzinfo=timezone.utc)
          if now < october:
              october = datetime(now.year - 1, 10, 1, tzinfo=timezone.utc)

          # Add a small buffer (24h) to avoid off-by-one truncation.
          hours = int((now - october).total_seconds() // 3600) + 24

          with open("${GITHUB_OUTPUT}", "a", encoding="utf-8") as fh:
              fh.write(f"hours={hours}\n")
          PY

      - name: Run script
        env:
          FEED_LIST: ${{ vars.TEST_FEED_LIST || 'feeds/test-blogs.json' }}
          FEED_URL: ${{ vars.FEED_URL || '' }}
          BLOG_FEED_URL: ${{ vars.BLOG_FEED_URL || '' }}
          WINDOW_HOURS: ${{ vars.TEST_WINDOW_HOURS || vars.WINDOW_HOURS || steps.october-window.outputs.hours }}
          MAX_POST_NUM: ${{ vars.TEST_MAX_POST_NUM || '-1' }}
          MAX_POSTS_PER_FEED: ${{ vars.TEST_MAX_POSTS_PER_FEED || '2' }}
          SEND_EMPTY: ${{ vars.SEND_EMPTY || 'false' }}
          TARGET_LANGUAGE: ${{ vars.TARGET_LANGUAGE || 'Chinese (Traditional)' }}
          EMAIL_SUBJECT_PREFIX: ${{ vars.EMAIL_SUBJECT_PREFIX || 'Blog Pusher Digest' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || secrets.OPENAI_MODEL || '' }}
          OPENAI_API_BASE: ${{ vars.OPENAI_API_BASE || secrets.OPENAI_API_BASE || '' }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL || 'z-ai/glm-5.2' }}
          NVIDIA_BASE_URL: ${{ vars.NVIDIA_BASE_URL || 'https://integrate.api.nvidia.com/v1' }}
          NVIDIA_API_URL: ${{ vars.NVIDIA_API_URL || '' }}
          NVIDIA_RPM: ${{ vars.NVIDIA_RPM || '4' }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SENDER: ${{ secrets.SENDER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER: ${{ secrets.RECEIVER }}
        run: |
          set -eo pipefail
          mkdir -p artifacts
          uv run main.py --debug --failure_log artifacts/feed_failures.log 2>&1 | tee artifacts/testflow.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflow-logs
          path: artifacts
          retention-days: 7
