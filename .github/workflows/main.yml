name: Blog Pusher Digest
on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Run script
        env:
          FEED_LIST: ${{ vars.FEED_LIST || 'feeds/blogs.json' }}
          FEED_URL: ${{ vars.FEED_URL || '' }}
          BLOG_FEED_URL: ${{ vars.BLOG_FEED_URL || '' }}
          WINDOW_HOURS: ${{ vars.WINDOW_HOURS || '24' }}
          MAX_POST_NUM: ${{ vars.MAX_POST_NUM || '-1' }}
          MAX_POSTS_PER_FEED: ${{ vars.MAX_POSTS_PER_FEED || '-1' }}
          SEND_EMPTY: ${{ vars.SEND_EMPTY || 'false' }}
          TARGET_LANGUAGE: ${{ vars.TARGET_LANGUAGE || 'Chinese (Traditional)' }}
          TRANSLATION_MAX_CHARS: ${{ vars.TRANSLATION_MAX_CHARS || '-1' }}
          EMAIL_SUBJECT_PREFIX: ${{ vars.EMAIL_SUBJECT_PREFIX || 'Blog Pusher Digest' }}
          EMAIL_MAX_POSTS: ${{ vars.EMAIL_MAX_POSTS || '5' }}
          EMAIL_MAX_BYTES: ${{ vars.EMAIL_MAX_BYTES || '90000' }}
          EMAIL_HTML_DIR: ${{ vars.EMAIL_HTML_DIR || 'artifacts' }}
          FETCH_WORKERS: ${{ vars.FETCH_WORKERS || '8' }}
          STATE_FILE: ${{ vars.STATE_FILE || 'state/last_run.json' }}
          STATE_MAX_BACKTRACK_HOURS: ${{ vars.STATE_MAX_BACKTRACK_HOURS || '72' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || secrets.OPENAI_MODEL || '' }}
          OPENAI_API_BASE: ${{ vars.OPENAI_API_BASE || secrets.OPENAI_API_BASE || '' }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL || 'z-ai/glm-5.2' }}
          NVIDIA_BASE_URL: ${{ vars.NVIDIA_BASE_URL || 'https://integrate.api.nvidia.com/v1' }}
          NVIDIA_API_URL: ${{ vars.NVIDIA_API_URL || '' }}
          NVIDIA_RPM: ${{ vars.NVIDIA_RPM || '4' }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SENDER: ${{ secrets.SENDER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER: ${{ secrets.RECEIVER }}
        run: |
          uv run main.py

      - name: Upload digest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: artifacts
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit run state
        if: success()
        env:
          STATE_FILE: ${{ vars.STATE_FILE || 'state/last_run.json' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f "$STATE_FILE" ]; then
            git add "$STATE_FILE"
            if ! git diff --cached --quiet; then
              git commit -m "chore: record digest run state [skip ci]"
              git pull --rebase origin "$GITHUB_REF_NAME" || true
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          fi
